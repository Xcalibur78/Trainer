<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mathe-Trainer</title>

<style>
body {
  font-family: Arial;
  background: #f4f6fb;
  margin: 0;
  padding: 20px;
}

.app {
  max-width: 700px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.1);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 40px;
}

.options {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.option {
  padding: 10px 14px;
  border: 1px solid #ccc;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.option.active {
  background: #c4001a;
  color: white;
}

.btn {
  width: 100%;
  padding: 14px;
  background: #c4001a;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
}

.hidden {
  display: none;
}

.task {
  font-size: 48px;
  text-align: center;
  margin-bottom: 20px;
}

.answer {
  width: 200px;
  padding: 10px;
  font-size: 24px;
  display: block;
  margin: auto;
}

.feedback {
  height: 40px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin: 10px 0;
}

.feedback.ok {
  color: green;
}

.feedback.bad {
  color: red;
}
</style>
</head>
<body>

<div class="app">
  <div class="card">

    <div class="header">
      <div class="brand">
        <div class="logo">🧮</div>
        <div>
          <h1>Mathe-Trainer</h1>
          <p class="subtitle">Für 9-Jährige</p>
        </div>
      </div>
      <div id="headerHighscore" class="badge">Highscore: <span id="valHighscore">0</span></div>
    </div>

    <div class="content">

      <!-- SETUP SCREEN -->
      <div id="screenSetup">
        <h2>Einstellungen</h2>

        <p>Rechenart:</p>
        <div class="options" id="optType">
          <div class="option active" data-value="mix">Mix</div>
          <div class="option" data-value="plus">Plus</div>
          <div class="option" data-value="minus">Minus</div>
          <div class="option" data-value="mal">Mal</div>
        </div>

        <p>Anzahl der Fragen:</p>
        <div class="options" id="optCount">
          <div class="option active" data-value="10">10</div>
          <div class="option" data-value="15">15</div>
          <div class="option" data-value="20">20</div>
        </div>

        <button class="btn" id="btnStart">Start</button>
      </div>

      <!-- QUIZ SCREEN -->
      <div id="screenQuiz" class="hidden">
        <div class="task-box">
          <div id="taskText" class="task"></div>
          <input id="answerInput" class="answer" type="number" autocomplete="off">
        </div>

        <div id="feedback" class="feedback"></div>

        <button class="btn" id="btnNext">Weiter</button>
      </div>

      <!-- SUMMARY SCREEN -->
      <div id="screenSummary" class="hidden">
        <h2>Fertig!</h2>
        <p id="summaryText"></p>
        <button class="btn" id="btnRestart">Nochmal spielen</button>
      </div>

    </div>
  </div>
</div>

<script>
// -----------------------------
// Zufallsfunktion
// -----------------------------
function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// -----------------------------
// Aufgabenarten wie im Foto
// -----------------------------
function genPlus() {
  const a = rand(10, 99);
  const b = rand(10, 99);
  return { task: `${a} + ${b}`, solution: a + b, type: "plus" };
}

function genMinus() {
  let a = rand(20, 99);
  let b = rand(10, a);
  return { task: `${a} - ${b}`, solution: a - b, type: "minus" };
}

function genBigMinus() {
  const a = [200,300,400,500,600,700,800,900][rand(0,7)];
  const b = rand(10, 20);
  return { task: `${a} - ${b}`, solution: a - b, type: "bigminus" };
}

function genMulPlus() {
  const a = rand(3, 9);
  const b = rand(3, 9);
  const c = rand(10, 70);
  return { task: `${a} × ${b} + ${c}`, solution: a * b + c, type: "mulplus" };
}

function genMul() {
  const a = rand(20, 70);
  const b = rand(3, 9);
  return { task: `${a} × ${b}`, solution: a * b, type: "mul" };
}

function genDiv() {
  const divisors = [3,4,5];
  const d = divisors[rand(0,2)];
  const result = rand(30, 100);
  const a = result * d;
  return { task: `${a} ÷ ${d}`, solution: result, type: "div" };
}

// -----------------------------
// Mix-Modus mit 3er-Blöcken
// -----------------------------
const ALL_TYPES = ["plus", "minus", "bigminus", "mulplus", "mul", "div"];

let mixOrder = [];
let mixIndex = 0;
let blockCounter = 0;

function prepareMixOrder() {
  mixOrder = [...ALL_TYPES].sort(() => Math.random() - 0.5);
  mixIndex = 0;
  blockCounter = 0;
}

function generateMixedTask() {
  const currentType = mixOrder[mixIndex];
  const task = generateByType(currentType);

  blockCounter++;

  if (blockCounter >= 3) {
    mixIndex++;
    blockCounter = 0;

    if (mixIndex >= mixOrder.length) {
      prepareMixOrder();
    }
  }

  return task;
}

function generateByType(type) {
  switch(type) {
    case "plus": return genPlus();
    case "minus": return genMinus();
    case "bigminus": return genBigMinus();
    case "mulplus": return genMulPlus();
    case "mul": return genMul();
    case "div": return genDiv();
  }
}

// -----------------------------
// SPIELSTEUERUNG
// -----------------------------
let mode = "mix";
let totalQuestions = 10;
let currentQuestion = 0;
let correct = 0;
let currentTask = null;

const screenSetup = document.getElementById("screenSetup");
const screenQuiz = document.getElementById("screenQuiz");
const screenSummary = document.getElementById("screenSummary");

const taskText = document.getElementById("taskText");
const answerInput = document.getElementById("answerInput");
const feedback = document.getElementById("feedback");

// Auswahlfelder
document.querySelectorAll("#optType .option").forEach(opt => {
  opt.addEventListener("click", () => {
    document.querySelectorAll("#optType .option").forEach(o => o.classList.remove("active"));
    opt.classList.add("active");
    mode = opt.dataset.value;
  });
});

document.querySelectorAll("#optCount .option").forEach(opt => {
  opt.addEventListener("click", () => {
    document.querySelectorAll("#optCount .option").forEach(o => o.classList.remove("active"));
    opt.classList.add("active");
    totalQuestions = Number(opt.dataset.value);
  });
});

// Start
document.getElementById("btnStart").addEventListener("click", () => {
  prepareMixOrder();
  currentQuestion = 0;
  correct = 0;

  screenSetup.classList.add("hidden");
  screenQuiz.classList.remove("hidden");

  nextTask();
});

// Neue Aufgabe
function nextTask() {
  feedback.textContent = "";

  if (currentQuestion >= totalQuestions) {
    showSummary();
    return;
  }

  currentQuestion++;

  currentTask = (mode === "mix") ? generateMixedTask() : generateByType(mode);

  taskText.textContent = currentTask.task;
  answerInput.value = "";
  answerInput.focus();
}

// Antwort prüfen
document.getElementById("btnNext").addEventListener("click", () => {
  const val = Number(answerInput.value);

  if (val === currentTask.solution) {
    feedback.textContent = "Richtig!";
    feedback.className = "feedback ok";
    correct++;
  } else {
    feedback.textContent = "Falsch!";
    feedback.className = "feedback bad";
  }

  setTimeout(nextTask, 600);
});

// Zusammenfassung
function showSummary() {
  screenQuiz.classList.add("hidden");
  screenSummary.classList.remove("hidden");

  document.getElementById("summaryText").textContent =
    `Du hast ${correct} von ${totalQuestions} richtig.`;
}

// Neustart
document.getElementById("btnRestart").addEventListener("click", () => {
  screenSummary.classList.add("hidden");
  screenSetup.classList.remove("hidden");
});
</script>

</body>
</html>
